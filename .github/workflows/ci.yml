name: CI - Tests and Linting

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # GITHUB_TOKEN vendor pushes from Sync Upstream Skills do not fire the
  # push trigger. workflow_run is the substitute so those commits still run CI.
  workflow_run:
    workflows: ["Sync Upstream Skills"]
    types:
      - completed

jobs:
  lint:
    name: Tests and Linting
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@v5

      # workflow_run.head_sha is the commit the sync job started from, not a
      # vendor commit it may have pushed afterwards. Check out the branch to
      # get post-push HEAD.
      - name: Checkout post-sync branch HEAD
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync

      - name: Run CI gate
        run: task ci

      - name: Show files modified by pre-commit hooks
        if: failure()
        run: |
          echo "::group::Files modified by pre-commit hooks"
          git diff --name-only
          echo "::endgroup::"
          echo ""
          echo "::group::Full diff of modifications"
          git diff
          echo "::endgroup::"
